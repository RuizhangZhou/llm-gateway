[project]
name = "llm-gateway"
version = "0.1.0"
description = "Server-wide LLM routing: KIconnect + Azure, task-based, quota-fallback"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
