# Task → provider:model priority lists.
# No credentials here — safe to commit.
# Credentials come from /root/.env via KICONNECT_API_KEY / AZURE_OPENAI_API_KEY.
# Updated weekly by scripts/refresh_routing.py (Mon 06:30 UTC).

providers:
  kiconnect:
    base_url: https://chat.kiconnect.nrw/api/v1
    api_key_env: KICONNECT_API_KEY
  azure:
    base_url_env: AZURE_OPENAI_BASE_URL
    api_key_env: AZURE_OPENAI_API_KEY
    api_version: "2025-04-01-preview"
    deployments_in_path: true   # openai.azure.com uses /openai/deployments/{model}/chat/completions

# First entry = preferred; fallback in order on 429/503.
# Strategy: always try KIconnect first; Azure is the fallback when KIconnect is rate-limited.
task_routing:
  cold_email:
    - kiconnect:gpt-oss-120b
    - kiconnect:gpt-5.2
    - azure:gpt-5.4
    - azure:gpt-5.3-chat
  blog:
    - kiconnect:gpt-oss-120b
    - kiconnect:gpt-5.2
    - azure:gpt-5.4
    - azure:gpt-5.3-chat
  code:
    - kiconnect:gpt-5.2
    - kiconnect:gpt-oss-120b
    - azure:gpt-5.4
  summarize:
    - kiconnect:mistral-small-4-119b-2603
    - kiconnect:gpt-5.4-mini
    - azure:gpt-5.4-mini
  classify:
    - kiconnect:gpt-5.4-mini
    - kiconnect:mistral-small-4-119b-2603
    - azure:gpt-5.4-mini
  job_score:
    - kiconnect:gpt-5.4-mini
    - kiconnect:mistral-small-4-119b-2603
    - azure:gpt-5.4-mini
  cv_tailor:
    - kiconnect:gpt-oss-120b
    - kiconnect:gpt-5.2
    - azure:gpt-5.4
    - azure:gpt-5.3-chat
  default:
    - kiconnect:gpt-oss-120b
    - kiconnect:gpt-5.2
    - azure:gpt-5.4
    - kiconnect:mistral-small-4-119b-2603
    - azure:gpt-5.4-mini

model_ranks:
  kiconnect:gpt-oss-120b: 100
  kiconnect:gpt-5.2: 90
  azure:gpt-5.4: 85
  azure:gpt-5.3-chat: 80
  kiconnect:gpt-5.4-mini: 70
  kiconnect:mistral-small-4-119b-2603: 60
  azure:gpt-5.4-mini: 55
