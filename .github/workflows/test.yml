name: Gateway hosted compatibility tests
on:
  pull_request:
  push:
    branches: ['work/hosted-runner-compat']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Shared GitHub routing loads without root access or provider keys
        env:
          LLM_GATEWAY_ROUTING_FILE: ${{ github.workspace }}/config/routing.yaml
        run: python -c 'from llm_gateway._config import get_config; c=get_config(); assert c["task_routing"]["blog"]; print("Shared routing loaded without root filesystem access")'
